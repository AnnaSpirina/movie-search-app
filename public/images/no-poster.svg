<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 900" width="600" height="900" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111525"/>
      <stop offset="1" stop-color="#25183A"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="46%" r="42%">
      <stop offset="0" stop-color="#B46CFF" stop-opacity="0.38"/>
      <stop offset="0.45" stop-color="#E26BC8" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#E26BC8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="icon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#C9A2FF"/>
      <stop offset="1" stop-color="#F39AD8"/>
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="600" height="900" fill="url(#bg)"/>
  <rect width="600" height="900" fill="url(#glow)"/>

  <!-- Иконка: хлопушка -->
  <g transform="translate(300 415)" fill="none" stroke="url(#icon)" stroke-width="7"
     stroke-linecap="round" stroke-linejoin="round" filter="url(#soft)">
    <!-- корпус -->
    <rect x="-80" y="-22" width="160" height="104" rx="12"/>
    <!-- верхняя планка, слегка приподнята -->
    <g transform="rotate(-12 -80 -34)">
      <rect x="-80" y="-58" width="160" height="30" rx="8"/>
      <path d="M-44 -58 L-62 -28 M-4 -58 L-22 -28 M36 -58 L18 -28 M76 -58 L58 -28"/>
    </g>
    <!-- полосы на корпусе -->
    <path d="M-80 10 H80" opacity="0.6"/>
  </g>

  <text x="300" y="800" text-anchor="middle"
        font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
        font-size="26" font-weight="500" letter-spacing="0.5" fill="#B7AEDB" fill-opacity="0.75">Постер недоступен</text>
</svg>
